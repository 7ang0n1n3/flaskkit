version: '3.8'

services:
  # Flask Application
  web:
    build: .
    image: flaskkit:latest
    container_name: flaskkit-web
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_CONFIG=production
      - SECRET_KEY=${SECRET_KEY:-your-secret-key-change-in-production}
      - DATABASE_URL=postgresql://flaskkit:${DB_PASSWORD:-flaskkit123}@db:5432/flaskkit
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - flaskkit_uploads:/app/uploads
    networks:
      - flaskkit-network
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: flaskkit-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=flaskkit
      - POSTGRES_USER=flaskkit
      - POSTGRES_PASSWORD=${DB_PASSWORD:-flaskkit123}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - flaskkit-network
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  # Redis for caching and sessions
  redis:
    image: redis:7-alpine
    container_name: flaskkit-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - flaskkit-network
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  # Nginx Reverse Proxy (Optional - for production)
  nginx:
    image: nginx:alpine
    container_name: flaskkit-nginx
    restart: unless-stopped
    ports:
      - "7000:80"
      - "7443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - web
    networks:
      - flaskkit-network
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  flaskkit_uploads:
    driver: local

networks:
  flaskkit-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.22.0.0/16
